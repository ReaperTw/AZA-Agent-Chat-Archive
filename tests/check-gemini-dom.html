<!doctype html>
<meta charset="utf-8">
<title>Gemini query DOM regression</title>
<pre id="result">Running</pre>
<script>window.module = { exports: {} };</script>
<script src="../userscripts/gyc-gemini.user.js"></script>
<script>
(async () => {
    const cases = [
        ['<span>  </span>', '', '  '],
        ['<span>  indented text  </span>', '', '  indented text  '],
        ['<!--before--><span> x </span><!--after-->', '', ' x '],
        [' <!--template--><span>  body  </span> ', '', '  body  '],
        ['  ', '', '  '],
        ['<br>', '', ''],
        ['<span> item </span>', 'query-bullet-item', '-  item ']
    ];
    try {
        for (const [html, className, expected] of cases) {
            const line = document.createElement('p');
            line.innerHTML = html;
            line.className = className;
            const actual = module.exports.readGeminiQueryLine(line);
            if (actual !== expected) throw new Error(`Expected ${JSON.stringify(expected)}, got ${JSON.stringify(actual)}`);
        }
        const body = document.createElement('div');
        body.innerHTML = '<p><strong>Focus</strong></p><ul><li>First</li><li><strong>Second</strong></li></ul>';
        const captured = module.exports.readDomBody(body);
        if (!captured.text.includes('**Focus**') || !captured.text.includes('- **Second**')) {
            throw new Error('Model DOM export lost bold or list Markdown');
        }
        const api = { role: 'assistant', text: '**Focus**\n\n* First\n* **Second**' };
        const dom = { role: 'assistant', ...captured };
        const merged = module.exports.buildIntegratedMarkdown([api], [dom]);
        if (merged.counts.conflicts !== 0) throw new Error('Rendered bold/list text should match');
        const domOnly = module.exports.buildIntegratedMarkdown([], [dom], { apiAvailable: false }).content;
        if (!domOnly.includes('**Focus**') || !domOnly.includes('- **Second**')) throw new Error('DOM-only output lost Markdown');
        body.innerHTML = '<p>Use <code>x  y</code>.</p><pre><code class="language-txt">x  y\n\nz \n</code></pre>';
        const code = { role: 'assistant', ...module.exports.readDomBody(body) };
        if (!code.text.includes('`x  y`') || !code.text.includes('```txt\nx  y\n\nz \n```')) throw new Error('DOM Markdown lost code boundaries or whitespace');
        if (module.exports.buildIntegratedMarkdown([{ role: 'assistant', text: 'Use `x  y`.\n\n```txt\nx  y\n\nz \n```' }], [code]).counts.conflicts !== 0) throw new Error('Code did not round-trip');
        if (module.exports.buildIntegratedMarkdown([{ role: 'assistant', text: 'Use `x y`.\n\n```txt\nx y\n\nz \n```' }], [code]).counts.conflicts !== 1) throw new Error('Code whitespace difference was hidden');
        body.innerHTML = '<ol start="3"><li><p>First</p><ul><li><em>Nested</em></li></ul></li><li>Next</li></ol>';
        const nested = module.exports.readDomBody(body);
        if (!nested.text.includes('3. First') || !nested.text.includes('   - *Nested*') || !nested.text.includes('4. Next')) throw new Error('DOM Markdown lost nested or ordered lists');
        body.innerHTML = '<p>Latest</p><elicitations><p>Explore Live</p><button class="elicitation-item" data-query="Hidden action"><span class="elicitation-label">Try Live</span></button></elicitations>';
        const controls = module.exports.readDomBody(body);
        if (!controls.text.includes('Try Live') || controls.text.includes('Hidden action')) throw new Error('DOM controls must export only visible labels');
        const chat = document.createElement('infinite-scroller');
        chat.className = 'chat-history';
        chat.innerHTML = `<div class="conversation-container" id="turn_fixture">
            <user-query><div class="query-text">
                <p class="query-text-line"><span>Steps:</span></p>
                <ol class="query-numbered-list">
                    <li class="query-numbered-item"><span>Prepare</span></li>
                    <li class="query-numbered-item"><span>Check</span></li>
                </ol>
                <ul><li class="query-bullet-item"><span>Reference</span></li></ul>
                <ol class="query-numbered-list" start="4">
                    <li class="query-numbered-item"><span>Submit</span></li>
                </ol>
            </div></user-query>
            <model-response><message-content><div class="markdown"><p>Done.</p></div></message-content></model-response>
        </div>`;
        document.body.append(chat);
        const menu = document.getElementById('gemini-export-fab-container');
        menu.lastElementChild.click();
        [...menu.querySelectorAll('button')].find(button => button.textContent === '正常匯出').click();
        const save = await new Promise((resolve, reject) => {
            const observer = new MutationObserver(() => {
                const button = [...document.querySelectorAll('#gemini-export-modal button')].find(node => node.textContent === '儲存 .md');
                if (!button) return;
                observer.disconnect();
                clearTimeout(timeout);
                resolve(button);
            });
            const timeout = setTimeout(() => { observer.disconnect(); reject(Error('Normal export did not reach save')); }, 15000);
            observer.observe(document.body, { subtree: true, childList: true });
        });
        let download;
        document.addEventListener('click', event => {
            if (event.target.matches('a[download]')) { event.preventDefault(); download = event.target.href; }
        });
        save.click();
        const exported = await (await fetch(download)).text();
        const userText = exported.split('# User 1\n\n')[1]?.split('\n\n# Model 1')[0];
        const expected = 'Steps:\n1. Prepare\n2. Check\n- Reference\n4. Submit';
        if (userText !== expected) throw new Error(`Normal export lost ordered list text: ${JSON.stringify(userText)}`);
        const mergeUser = text => module.exports.buildIntegratedMarkdown([{ role: 'user', text }], [{ role: 'user', text: userText }]);
        if (mergeUser(expected).counts.conflicts !== 0 || mergeUser(expected.replace('4. Submit', '5. Submit')).counts.conflicts !== 1) {
            throw new Error('Identical ordered lists should match, but changed numbers must still conflict');
        }
        document.getElementById('result').textContent = `PASS: ${cases.length} query cases; Model Markdown; literal code whitespace; normal export preserves User numbering and detects changed ordinals`;
    } catch (error) {
        document.getElementById('result').textContent = 'FAIL: ' + error.message;
        throw error;
    }
})();
</script>
