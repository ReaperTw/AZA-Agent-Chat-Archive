<!doctype html>
<meta charset="utf-8">
<title>Claude body and reference regression</title>
<pre id="result">Running</pre>
<iframe id="fixture" title="Synthetic Claude transcript"></iframe>
<script>
(async () => {
    const assert = (value, message) => { if (!value) throw Error(message); };
    const win = document.getElementById('fixture').contentWindow;
    const doc = win.document;
    const source = await (await fetch('../userscripts/gyc-claude.user.js', { cache: 'no-store' })).text();
    win.eval(source.replace(/const observer = new MutationObserver\([^\n]+\);/,
        'globalThis.fixture = {domSnapshot, compareTranscripts, buildIntegratedMarkdown, prepareComparisonMessage}; return;'));
    const api = win.fixture;
    const capture = (html, role = 'assistant', after = '') => {
        const message = `<div data-testid="${role}-message">${html}</div>`;
        doc.body.innerHTML = `<main>${role === 'user'
            ? `<div class="group/message-row items-end"><div><div data-testid="file-thumbnail">Attachment</div></div><div>${message}</div>${after}</div>`
            : message}</main>`;
        return api.domSnapshot(doc.querySelector('main'))[0];
    };
    const markdown = "Answer\n\nSources:\n- [Publisher's title](https://example.test/source)";
    const dom = capture('<p>Answer</p><p>Sources:</p><ul><li><a href="https://example.test/source">Publisher’s title</a></li></ul><button>建立文件</button><div role="button">Another action</div>');
    assert(!dom.text.includes('建立文件') && !dom.text.includes('Another action'), 'Action controls leaked into exported answer');
    assert(dom.text.includes('Publisher’s title'), 'Visible source label was lost from export');
    assert(dom.citations.some(item => item.label === 'Publisher’s title' && item.url === 'https://example.test/source'), 'Source link metadata was lost');
    assert(api.compareTranscripts([{ role: 'assistant', text: markdown }], [dom]).match, 'Reference typography caused a body conflict');
    const merged = api.buildIntegratedMarkdown([{ role: 'assistant', text: markdown }], [dom]);
    assert(merged.counts.conflicts === 0 && merged.content.includes(markdown), 'Combined export lost the original source list');
    assert(!merged.content.includes('來源衝突'), 'Combined export retained a false conflict');
    const literal = capture('<p>建立文件 is part of this answer.</p><p>Publisher’s answer</p><pre><code>x  y\n</code></pre>');
    assert(literal.text.includes('建立文件 is part of this answer.'), 'Literal action wording was deleted');
    const contraction = { role: 'assistant', text: "建立文件 is part of this answer.\n\nPublisher's answer\n\n```\nx  y\n```" };
    assert(api.compareTranscripts([contraction], [literal]).match, 'Rendered prose apostrophe caused a false conflict');
    assert(api.buildIntegratedMarkdown([contraction], [literal]).content.includes("Publisher's answer"), 'Original API punctuation was rewritten in export');
    assert(!api.compareTranscripts([{ ...contraction, text: contraction.text.replace('answer.', 'revision.') }], [literal]).match, 'Real wording difference was hidden');
    const codeApostrophe = capture('<p>It’s visible.</p><p>Use <code>don\'t</code>.</p><pre><code>author\'s value\n</code></pre>');
    const codeSource = { role: 'assistant', text: "It's visible.\n\nUse `don't`.\n\n```\nauthor's value\n```" };
    assert(api.compareTranscripts([codeSource], [codeApostrophe]).match, 'Prose typography or literal code apostrophe did not round-trip');
    assert(!api.compareTranscripts([{ ...codeSource, text: codeSource.text.replace("`don't`", '`don’t`') }], [codeApostrophe]).match, 'Inline-code apostrophe difference was hidden');
    assert(!api.compareTranscripts([{ ...codeSource, text: codeSource.text.replace("author's value", 'author’s value') }], [codeApostrophe]).match, 'Fenced-code apostrophe difference was hidden');
    for (const html of [
        '<p>Answer</p><p>Sources:</p><ul><li>Important unlinked text</li></ul>',
        '<p>Answer</p><p>Sources:</p><ul><li><a href="https://example.test">Source</a> with explanation</li></ul>',
        '<p>Answer</p><p>Sources:</p><ul><li><a href="https://example.test">Source</a></li></ul><p>More answer</p>'
    ]) assert(api.prepareComparisonMessage(capture(html), 'dom').body.includes('Sources:'), 'Unproven reference block was removed from comparison');
    const code = capture('<p>Use <code>x  y</code>.</p><pre><code>x  y\n\nz \n</code></pre>');
    assert(api.compareTranscripts([{ role: 'assistant', text: 'Use `x  y`.\n\n```\nx  y\n\nz \n```' }], [code]).match, 'Code whitespace did not round-trip');
    assert(!api.compareTranscripts([{ role: 'assistant', text: 'Use `x y`.\n\n```\nx y\n\nz \n```' }], [code]).match, 'Code whitespace difference was hidden');
    // A lightly indented API list renders as <ol>, with the continuation inside the last <li>.
    const prompt = { role: 'user', text: 'Opening\n\n 1. First item\n 2. Second item\n\n Continuation\n\nClosing' };
    const listPage = '<div class="contents"><p>Opening</p><ol><li>First item</li><li><p>Second item</p><p>Continuation</p></li></ol><p>Closing</p></div>';
    const stored = api.buildIntegratedMarkdown([prompt], [capture(listPage, 'user')]);
    assert(stored.counts.conflicts === 0 && stored.content.includes(prompt.text), 'A rendered user list conflicted with its original Markdown');
    for (const altered of [
        listPage.replace('<ol>', '<ol start="2">'),
        listPage.replace('Second item', 'Second revised item'),
        listPage.replace('<ol>', '<ol>Additional visible text'),
        listPage.replace('Continuation', 'Continu  ation'),
        listPage.replace('<ol><li>First item</li><li><p>Second item</p><p>Continuation</p></li></ol>', '<p>First item</p><p>Second item</p><p>Continuation</p>'),
    ]) assert(!api.compareTranscripts([prompt], [capture(altered, 'user')]).match, 'A real user list change was hidden');
    assert(!api.compareTranscripts([{ ...prompt, text: 'Opening\n\nFirst item\nSecond item\n\nContinuation\n\nClosing' }],
        [capture(listPage, 'user')]).match, 'A list was matched to plain text without numbering');
    assert(!api.compareTranscripts([prompt], [capture(listPage, 'user', '<p>Additional visible text</p>')]).match,
        'Visible text outside the numbered prompt was ignored');
    document.getElementById('result').textContent = 'PASS: Claude controls, references, original export, prose typography, literal code, rendered user lists and real changes';
    document.documentElement.dataset.result = 'pass';
})().catch(error => {
    document.getElementById('result').textContent = 'FAIL: ' + error.message;
    document.documentElement.dataset.result = 'fail';
});
</script>
